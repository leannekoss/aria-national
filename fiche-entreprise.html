<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Fiche entreprise - ANIA x Parlementaires</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='2' y='17' width='6' height='13' fill='%23e85d04'/><rect x='11' y='9' width='6' height='21' fill='%231a1a2e'/><rect x='20' y='2' width='6' height='28' fill='%23e85d04'/><rect x='1' y='30' width='30' height='2' fill='%231a1a2e'/></svg>">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9/dist/leaflet.css"/>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #f5f5f7; color: #1d1d1f; }
.top-nav { background: #1a1a2e; color: white; padding: 0 24px; display: flex; align-items: center; gap: 24px; height: 52px; position: sticky; top: 0; z-index: 1000; }
.nav-brand { font-weight: 700; font-size: 16px; white-space: nowrap; }
.nav-links { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.nav-link { color: rgba(255,255,255,0.75); text-decoration: none; padding: 6px 12px; border-radius: 6px; font-size: 13px; transition: all .2s; white-space: nowrap; }
.nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.15); color: white; }
.container { max-width: 1200px; margin: 0 auto; padding: 24px 20px; }
.page-title { font-size: 28px; font-weight: 800; margin-bottom: 6px; }
.page-subtitle { font-size: 14px; color: #666; margin-bottom: 24px; }
.card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.card:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12); }
.badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; }
.badge-agri { background: #d4edda; color: #155724; }
.badge-eco { background: #cce5ff; color: #004085; }
.badge-egalim { background: #fff3cd; color: #856404; }
.badge-an { background: #fce8d5; color: #8a3a00; }
.badge-sen { background: #d9e8ff; color: #003680; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; padding: 10px 12px; background: #f8f9fa; font-weight: 600; font-size: 12px; color: #555; border-bottom: 2px solid #eee; cursor: pointer; user-select: none; white-space: nowrap; }
th:hover { background: #e9ecef; }
td { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; vertical-align: middle; }
tr:hover td { background: #fafafa; }
.search-bar { width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-size: 14px; margin-bottom: 12px; }
.search-bar:focus { outline: 2px solid #e85d04; outline-offset: 1px; border-color: #e85d04; }
.filter-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
.filter-select { padding: 6px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 13px; background: white; }
.stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; margin-bottom: 24px; }
.stat-card { background: white; border-radius: 10px; padding: 20px 16px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
.stat-value { font-size: 36px; font-weight: 700; color: #1a1a2e; }
.stat-label { font-size: 12px; color: #666; margin-top: 6px; }
.pagination { display: flex; gap: 4px; justify-content: center; margin-top: 16px; flex-wrap: wrap; }
.page-btn { padding: 5px 10px; border: 1px solid #ddd; border-radius: 4px; background: white; cursor: pointer; font-size: 13px; }
.page-btn.active { background: #1a1a2e; color: white; border-color: #1a1a2e; }
.page-btn:hover:not(.active) { background: #f0f0f0; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); }
:focus-visible { outline: 2px solid #e85d04; outline-offset: 2px; }
@media(max-width:640px) { .top-nav { padding: 6px 12px; gap: 8px; height: auto; flex-wrap: wrap; } .nav-links { width: 100%; overflow-x: auto; } .nav-link { padding: 4px 8px; font-size: 11px; } }
@media(max-width:768px) { table { font-size: 12px; } th, td { padding: 6px 8px; } .filter-row { flex-direction: column; } .filter-select { width: 100%; } }

.grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 16px; }
@media(max-width:768px) { .grid-2 { grid-template-columns: 1fr; } }
.info-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f0f0f0; font-size: 13px; }
.info-label { color: #888; }
.info-value { font-weight: 600; text-align: right; }
.score-badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-weight: 700; font-size: 14px; }
.score-1 { background: #d4edda; color: #155724; }
.score-2 { background: #cce5ff; color: #004085; }
.score-3 { background: #fff3cd; color: #856404; }
.score-4 { background: #f8d7da; color: #721c24; }
.dirigeant { padding: 6px 0; border-bottom: 1px solid #f5f5f5; font-size: 13px; }
.dir-qualite { font-size: 11px; color: #888; }
.etab-item { padding: 8px 12px; border-bottom: 1px solid #f0f0f0; font-size: 13px; display: flex; justify-content: space-between; align-items: center; }
.etab-item:last-child { border-bottom: none; }
.spinner { width: 40px; height: 40px; border: 4px solid #eee; border-top: 4px solid #1a1a2e; border-radius: 50%; animation: spin 1s linear infinite; margin: 40px auto 16px; }
@keyframes spin { to { transform: rotate(360deg); } }
.back-link { display: inline-flex; align-items: center; gap: 6px; color: #666; text-decoration: none; font-size: 13px; margin-bottom: 16px; }
.back-link:hover { color: #1a1a2e; }
.denree-tag { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 11px; background: #f0f0f0; margin: 2px; }
</style>
</head>
<body>
<nav class="top-nav"><a href="accueil.html" class="nav-brand-link ">ANIA</a><div class="nav-links"><a href="index.html" class="nav-link ">Carte</a><a href="parlementaires.html" class="nav-link ">Parlementaires</a><a href="regions.html" class="nav-link ">Régions ARIA</a><a href="partis.html" class="nav-link ">Partis</a><a href="entreprises.html" class="nav-link ">Entreprises</a><a href="groupes.html" class="nav-link ">Industriels</a><a href="methodologie.html" class="nav-link ">Méthode</a></div></nav><style>.nav-brand-link{color:white;text-decoration:none;font-weight:700;font-size:16px;white-space:nowrap;padding:4px 8px;border-radius:6px;transition:all .2s}.nav-brand-link:hover,.nav-brand-link.active{background:rgba(255,255,255,.15)}</style>
<div class="container">
<a href="entreprises.html" class="back-link">← Retour aux entreprises</a>
<div id="loading"><div class="spinner"></div><p style="text-align:center;color:#888">Chargement des données entreprise...</p></div>
<div id="error" style="display:none;text-align:center;padding:40px">
  <div style="font-size:48px;margin-bottom:16px">🔍</div>
  <h2 id="error-title">Entreprise non trouvée</h2>
  <p id="error-msg" style="color:#888;margin-top:8px"></p>
  <a href="entreprises.html" style="display:inline-block;margin-top:16px;padding:8px 20px;background:#1a1a2e;color:white;border-radius:8px;text-decoration:none">Rechercher une entreprise</a>
</div>
<div id="content" style="display:none">
  <div id="header"></div>
  <div class="grid-2">
    <div class="card" id="info-card"></div>
    <div class="card" style="padding:0;overflow:hidden"><div id="map" style="height:350px"></div></div>
  </div>
  <div class="grid-2">
    <div class="card" id="finance-card"></div>
    <div class="card" id="alim-card"></div>
  </div>
  <div class="card" id="parl-card" style="margin-top:16px"></div>
  <div class="card" id="sites-card" style="margin-top:16px"></div>
</div>
</div>
<script src="https://unpkg.com/leaflet@1.9/dist/leaflet.js"></script>
<script>
const EFFECTIF = {'00':'Non employeur','01':'1-2','02':'3-5','03':'6-9','11':'10-19','12':'20-49','21':'50-99','22':'100-199','31':'200-249','32':'250-499','41':'500-999','42':'1 000-1 999','51':'2 000-4 999','52':'5 000-9 999','53':'10 000+'};
const CAT_LABELS = {'PME':'PME','ETI':'ETI','GE':'Grande entreprise','MIC':'Micro-entreprise'};
const ALIM_SCORES = {1:'Très satisfaisant',2:'Satisfaisant',3:'À améliorer',4:'À corriger de manière urgente'};
const NAF_LABELS = {'10.11Z':'Abattage/viande','10.12Z':'Volaille','10.13A':'Prépa viande','10.13B':'Charcuterie','10.31Z':'Pommes de terre','10.32Z':'Jus','10.39A':'Légumes surgelés','10.39B':'Fruits/légumes','10.41A':'Huile olive','10.41B':'Huiles végétales','10.51A':'Lait/crème','10.51C':'Beurre','10.51D':'Fromage','10.52Z':'Glaces','10.72Z':'Biscuits','10.84Z':'Condiments','10.85Z':'Plats préparés','10.86Z':'Diététiques','10.89Z':'Autres alim.','11.01Z':'Eaux-de-vie','11.02A':'Vins AOC','11.02B':'Autres vins','11.03Z':'Cidre','11.07A':'Eaux minérales','11.07B':'Boissons'};
const params = new URLSearchParams(location.search);
const siren = params.get('siren') || (params.get('siret') ? params.get('siret').slice(0,9) : null);
if(!siren) {
  document.getElementById('loading').style.display='none';
  document.getElementById('error').style.display='block';
  document.getElementById('error-msg').textContent='Paramètre manquant. Usage: ?siren=XXXXXXXXX ou ?siret=XXXXXXXXXXXXXX';
} else {
(async()=>{
  try {
    const [sitesData, parlData, sireneResp, alimResp] = await Promise.all([
      fetch('data/sites.json').then(r=>r.json()),
      fetch('data/parlementaires.json').then(r=>r.json()),
      fetch('https://recherche-entreprises.api.gouv.fr/search?q='+siren+'&per_page=1').then(r=>r.json()),
      fetch('https://dgal.opendatasoft.com/api/records/1.0/search/?dataset=export_alimconfiance&q='+siren+'&rows=10').then(r=>r.json()).catch(()=>({records:[]})),
    ]);
    const ent = sireneResp.results && sireneResp.results[0];
    if(!ent || ent.siren!==siren) {
      document.getElementById('loading').style.display='none';
      document.getElementById('error').style.display='block';
      document.getElementById('error-msg').textContent='SIREN '+siren+' non trouvé dans la base SIRENE.';
      return;
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('content').style.display='block';
    document.title = ent.nom_complet + ' - Fiche ANIA';

    // Header
    const cat = CAT_LABELS[ent.categorie_entreprise]||ent.categorie_entreprise||'';
    const siege = ent.siege||{};
    const nafLabel = NAF_LABELS[siege.activite_principale]||siege.activite_principale||'';
    document.getElementById('header').innerHTML = `
      <h1 class="page-title" style="margin-bottom:4px">${ent.nom_complet}</h1>
      <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px">
        <span class="badge badge-eco">SIREN ${ent.siren}</span>
        ${cat?'<span class="badge badge-agri">'+cat+'</span>':''}
        ${nafLabel?'<span class="badge badge-egalim">'+nafLabel+'</span>':''}
        <span class="badge" style="background:${ent.etat_administratif==='A'?'#d4edda':'#f8d7da'};color:${ent.etat_administratif==='A'?'#155724':'#721c24'}">${ent.etat_administratif==='A'?'✅ Active':'❌ Fermée'}</span>
      </div>`;

    // Info card
    const dirs = (ent.dirigeants||[]).map(d=>{
      if(d.type_dirigeant==='personne physique') return `<div class="dirigeant">👤 ${d.prenoms||''} ${d.nom||''}<div class="dir-qualite">${d.qualite||''}</div></div>`;
      return `<div class="dirigeant">🏢 ${d.denomination||d.siren||''}<div class="dir-qualite">${d.qualite||''}</div></div>`;
    }).join('');
    const effectif = EFFECTIF[String(ent.tranche_effectif_salarie)]||'-';
    const dateCreation = ent.date_creation ? new Date(ent.date_creation).toLocaleDateString('fr-FR') : '-';
    const idcc = (ent.complements&&ent.complements.liste_idcc||[]).join(', ')||'-';
    const labels = [];
    if(ent.complements) {
      if(ent.complements.est_bio) labels.push('🌿 Bio');
      if(ent.complements.est_ess) labels.push('🤝 ESS');
      if(ent.complements.est_rge) labels.push('♻️ RGE');
      if(ent.complements.est_societe_mission) labels.push('🎯 Société à mission');
      if(ent.complements.est_alim_confiance) labels.push('🔬 Alim\'confiance');
    }
    document.getElementById('info-card').innerHTML = `
      <h3 style="margin-bottom:12px">📋 Informations</h3>
      <div class="info-row"><span class="info-label">Adresse siège</span><span class="info-value">${siege.adresse||'-'}</span></div>
      <div class="info-row"><span class="info-label">Commune</span><span class="info-value">${siege.libelle_commune||'-'} (${siege.departement||''})</span></div>
      <div class="info-row"><span class="info-label">Effectif</span><span class="info-value">${effectif} salariés</span></div>
      <div class="info-row"><span class="info-label">Création</span><span class="info-value">${dateCreation}</span></div>
      <div class="info-row"><span class="info-label">Convention collective</span><span class="info-value">${idcc}</span></div>
      <div class="info-row"><span class="info-label">Établissements</span><span class="info-value">${ent.nombre_etablissements_ouverts||0} ouverts / ${ent.nombre_etablissements||0} total</span></div>
      ${labels.length?'<div style="margin-top:8px">'+labels.join(' ')+'</div>':''}
      ${dirs?'<h4 style="margin-top:16px;margin-bottom:8px">👥 Dirigeants</h4>'+dirs:''}`;

    // Map
    const map = L.map('map').setView([46.5, 2.5], 5);
    L.tileLayer('https://{s}.tile.openstreetmap.fr/osmfr/{z}/{x}/{y}.png', {
      maxZoom:18, attribution:'OSM France'
    }).addTo(map);
    // Add siege marker
    if(siege.latitude && siege.longitude) {
      L.marker([parseFloat(siege.latitude),parseFloat(siege.longitude)], {
        icon: L.divIcon({html:'<div style="background:#e85d04;width:14px;height:14px;border-radius:50%;border:2px solid white;box-shadow:0 1px 4px rgba(0,0,0,.4)"></div>',className:'',iconSize:[14,14],iconAnchor:[7,7]})
      }).addTo(map).bindPopup('<b>Siège</b><br>'+siege.adresse);
    }
    // Add matching establishments
    const etabs = ent.matching_etablissements||[];
    const bounds = [];
    etabs.forEach(e=>{
      if(!e.latitude||!e.longitude) return;
      const ll = [parseFloat(e.latitude),parseFloat(e.longitude)];
      bounds.push(ll);
      const color = e.est_siege ? '#e85d04' : '#1a1a2e';
      L.circleMarker(ll, {radius:6,fillColor:color,fillOpacity:.8,color:'white',weight:1})
        .addTo(map).bindPopup((e.est_siege?'<b>Siège</b>':'<b>Établissement</b>')+'<br>'+e.libelle_commune+'<br>'+e.adresse);
    });
    // Add our sites
    const mySites = sitesData.filter(s=>s.siren===siren);
    mySites.forEach(s=>{
      if(!s.lat||!s.lng) return;
      bounds.push([s.lat,s.lng]);
      L.circleMarker([s.lat,s.lng], {radius:5,fillColor:'#2e8b57',fillOpacity:.7,color:'white',weight:1})
        .addTo(map).bindPopup('<b>Site IAA</b><br>'+s.nom+'<br>'+s.naf_label);
    });
    if(bounds.length>0) map.fitBounds(bounds, {padding:[30,30]});

    // Finance card
    const fin = ent.finances||{};
    const years = Object.keys(fin).sort().reverse();
    let finHtml = '<h3 style="margin-bottom:12px">💰 Données financières</h3>';
    if(years.length) {
      years.forEach(y=>{
        const f = fin[y];
        const ca = f.ca!=null ? (f.ca>1e6?(f.ca/1e6).toFixed(1)+'M€':f.ca.toLocaleString('fr-FR')+'€') : '-';
        const rn = f.resultat_net!=null ? (f.resultat_net>0?'+':'')+f.resultat_net.toLocaleString('fr-FR')+'€' : '-';
        const rnColor = f.resultat_net>0?'#155724':f.resultat_net<0?'#721c24':'#666';
        finHtml += `<div class="info-row"><span class="info-label">CA ${y}</span><span class="info-value">${ca}</span></div>
          <div class="info-row"><span class="info-label">Résultat net ${y}</span><span class="info-value" style="color:${rnColor}">${rn}</span></div>`;
      });
    } else { finHtml += '<p style="color:#888;font-size:13px">Aucune donnée financière disponible</p>'; }
    finHtml += '<p style="font-size:11px;color:#aaa;margin-top:12px">Source: API recherche-entreprises (DGFIP)</p>';
    document.getElementById('finance-card').innerHTML = finHtml;

    // Alim'confiance card
    const alimRecs = alimResp.records||[];
    let alimHtml = '<h3 style="margin-bottom:12px">🔬 Alim\'confiance - Inspections sanitaires</h3>';
    if(alimRecs.length) {
      alimRecs.forEach(rec=>{
        const f = rec.fields;
        const score = f.app_code_synthese_eval_sanit;
        const label = ALIM_SCORES[score]||f.synthese_eval_sanit||'Inconnu';
        const denrees = (f.denree||'').split('|').filter(Boolean);
        const dateInsp = f.date_inspection ? new Date(f.date_inspection).toLocaleDateString('fr-FR') : '-';
        alimHtml += `
          <div style="margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid #f0f0f0">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
              <span class="score-badge score-${score}">${label}</span>
              <span style="font-size:12px;color:#888">Inspecté le ${dateInsp}</span>
            </div>
            <div class="info-row"><span class="info-label">Activité</span><span class="info-value">${f.type_activite||'-'}</span></div>
            <div class="info-row"><span class="info-label">Agrément</span><span class="info-value">${f.agrement||'-'}</span></div>
            ${f.libelle_agrement?'<div class="info-row"><span class="info-label">Type</span><span class="info-value" style="font-size:11px">'+f.libelle_agrement+'</span></div>':''}
            ${denrees.length?'<div style="margin-top:8px">'+denrees.map(d=>'<span class="denree-tag">'+d.trim()+'</span>').join('')+'</div>':''}
          </div>`;
      });
    } else { alimHtml += '<p style="color:#888;font-size:13px">Aucune inspection trouvée pour ce SIREN</p>'; }
    alimHtml += '<p style="font-size:11px;color:#aaa;margin-top:8px">Source: Ministère de l\'Agriculture (Alim\'confiance)</p>';
    document.getElementById('alim-card').innerHTML = alimHtml;

    // Parlementaires du territoire
    const myDepts = new Set([...(mySites.map(s=>s.dept)),siege.departement].filter(Boolean));
    const myParls = parlData.filter(p=>myDepts.has(p.dept)).sort((a,b)=>b.score-a.score).slice(0,20);
    let parlHtml = '<h3 style="margin-bottom:12px">🏛️ Parlementaires du territoire ('+myDepts.size+' dept'+(myDepts.size>1?'s':'')+')</h3>';
    if(myParls.length) {
      parlHtml += '<div style="overflow-x:auto"><table><thead><tr><th>Élu</th><th>Chambre</th><th>Groupe</th><th>Dept</th><th style="text-align:center">Score ARIA</th></tr></thead><tbody>';
      myParls.forEach(p=>{
        const chambreBadge = p.chambre==='AN'?'badge-an':'badge-sen';
        parlHtml += `<tr>
          <td><a href="fiche.html?id=${p.id}" style="color:#1a1a2e;text-decoration:none;font-weight:600;border-bottom:1px dotted #ccc">${p.nom}</a></td>
          <td><span class="badge ${chambreBadge}">${p.chambre}</span></td>
          <td style="font-size:12px">${p.groupe_abrev}</td>
          <td style="text-align:center">${p.dept}</td>
          <td style="text-align:center;font-weight:700">${p.score.toFixed(1)}</td>
        </tr>`;
      });
      parlHtml += '</tbody></table></div>';
    } else { parlHtml += '<p style="color:#888;font-size:13px">Aucun parlementaire identifié dans les départements de cette entreprise</p>'; }
    document.getElementById('parl-card').innerHTML = parlHtml;

    // Sites dans nos données
    let sitesHtml = '<h3 style="margin-bottom:12px">📍 Sites de production dans nos données ('+mySites.length+')</h3>';
    if(mySites.length) {
      mySites.forEach(s=>{
        sitesHtml += `<div class="etab-item">
          <div><b>${s.nom}</b><div style="font-size:11px;color:#888">${s.naf_label} (${s.naf})</div></div>
          <div style="text-align:right;font-size:12px;color:#666">${s.cp} ${s.commune}<br><span style="font-size:11px">Dept ${s.dept} - ${s.aria_region}</span></div>
        </div>`;
      });
    } else { sitesHtml += '<p style="color:#888;font-size:13px">Cette entreprise n\'apparaît pas dans notre base de sites IAA (NAF 10.*/11.*). Les données ci-dessus proviennent directement de l\'INSEE et d\'Alim\'confiance.</p>'; }
    document.getElementById('sites-card').innerHTML = sitesHtml;

  } catch(e) {
    document.getElementById('loading').style.display='none';
    document.getElementById('error').style.display='block';
    document.getElementById('error-msg').textContent='Erreur technique: '+e.message;
  }
})();
}
</script>
</body>
</html>
